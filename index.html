<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex_IA Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 1.2rem;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .card-title {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-value {
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 6px;
    }
    .signal-BUY { color: #22c55e; }
    .signal-SELL { color: #ef4444; }
    .signal-NEUTRAL { color: #e2e8f0; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .status-dot {
      height: 8px;
      width: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1><span class="status-dot"></span>VORTEX_IA DASHBOARD</h1>

  <div class="card">
    <div class="card-title">Consensus Stratégies (14 Agents)</div>
    <div id="consensus" class="card-value signal-NEUTRAL">CHARGEMENT...</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">Prob. IA Achat</div>
      <div id="prob-buy" class="card-value signal-BUY">--%</div>
    </div>
    <div class="card">
      <div class="card-title">Prob. IA Vente</div>
      <div id="prob-sell" class="card-value signal-SELL">--%</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">Tendance H1</div>
      <div id="trend-h1" class="card-value">--</div>
    </div>
    <div class="card">
      <div class="card-title">Positions Ouvertes</div>
      <div id="open-pos" class="card-value">--</div>
    </div>
  </div>

  <div class="footer">
    Mise à jour automatique toutes les 3 secondes
  </div>

  <script>
    // Initialisation de Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.expand();

    // URL corrigée avec le bon endpoint
    const API_URL = "https://paddle-corporate-maternal.ngrok-free.dev/api/status"; 

    async function fetchStatus() {
      try {
        const response = await fetch(API_URL, {
          headers: {
            'ngrok-skip-browser-warning': 'true'
          }
        });
        const data = await response.json();

        // Mise à jour du consensus
        const consensusEl = document.getElementById("consensus");
        if (data.consensus_signal) {
          consensusEl.innerText = `${data.consensus_signal} (${data.consensus_score ?? 0}%)`;
          consensusEl.className = `card-value signal-${data.consensus_signal}`;
        }

        // Mise à jour des probabilités XGBoost
        document.getElementById("prob-buy").innerText = `${data.prob_buy ?? 0}%`;
        document.getElementById("prob-sell").innerText = `${data.prob_sell ?? 0}%`;

        // Tendance H1 & Positions
        document.getElementById("trend-h1").innerText = data.trend_h1 ?? "--";
        
        // Gestion des positions ouvertes
        const posCount = Array.isArray(data.open_positions) ? data.open_positions.length : (data.open_positions ?? 0);
        document.getElementById("open-pos").innerText = posCount;

      } catch (err) {
        console.error("Erreur de connexion à l'API :", err);
      }
    }

    // Rafraîchissement toutes les 3 secondes
    fetchStatus();
    setInterval(fetchStatus, 3000);
  </script>
</body>
</html>
